[project]
name = "house-photo-mapper"
version = "0.1.0"
description = "Minimize time to document buildings while producing professional, editable reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pymupdf>=1.26.0",
    "pydantic>=2.13.4",
    "pyside6>=6.11.1",
    "structlog>=26.1.0",
    "imagehash>=4.3.2",
    "pillow-heif>=1.4.0",
    "reportlab>=4.4",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.21",
    "pyappdist>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/house_photo_mapper"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function calls in argument defaults
]
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
enable_error_code = ["attr-defined", "name-defined", "arg-type", "return-value", "call-overload", "operator", "index", "misc", "union-attr", "assignment", "call-arg", "dict-item", "list-item", "return-value", "type-arg", "valid-type", "override", "no-redef", "no-untyped-def", "unused-ignore", "redundant-expr", "truthy-bool", "truthy-function", "truthy-iterable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-x -q --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src/house_photo_mapper"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit]
default_install_hook_types = ["pre-commit", "pre-push"]

[tool.pyappdist]
name = "HousePhotoMapper"
python = "3.12"
macos_deployment_target = "10.14"
identifier = "com.housephotomapper.HousePhotoMapper"

[[tool.pyappdist.launchers]]
name = "house-photo-mapper"
entry = "house_photo_mapper.__main__:main"
gui = true
icon = { macos = "resources/icons/app_1024.png" }

[[tool.pyappdist.targets]]
name = "macos-arm64-app"
platform = "macos-aarch64"
format = "macapp"
codesign_identity = { env = "CODESIGN_IDENTITY" }
entitlements = "resources/entitlements.plist"

[[tool.pyappdist.targets]]
name = "macos-arm64-dmg"
platform = "macos-aarch64"
format = "dmg"
codesign_identity = { env = "CODESIGN_IDENTITY" }
entitlements = "resources/entitlements.plist"
notarize = true
notarize_profile = { env = "NOTARY_PROFILE" }
